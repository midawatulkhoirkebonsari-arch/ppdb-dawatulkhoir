<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Inden yang Sudah Masuk - MI Da'watul Khoir</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg-color: #f0fdf4;
            --text-main: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header-banner {
            background-color: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .header-banner h1 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-box {
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            width: 300px;
            font-size: 14px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #f8fafc;
            color: #4b5563;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f0fdf4;
        }
        .badge {
            background-color: #d1fae5;
            color: #065f46;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>

    <div class="header-banner">
        <h1>Status Calon Siswa Baru Jalur Inden</h1>
        <p style="margin: 0; font-size: 14px; opacity: 0.9;">MI Da'watul Khoir TP. 2027/2028</p>
    </div>

    <div class="info-bar">
        <div id="totalData" style="font-weight: 600; color: #4b5563;">Memuat data...</div>
        <input type="text" id="searchInput" class="search-box" placeholder="Cari nama siswa, ayah, atau ibu..." onkeyup="filterTable()">
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>NO</th>
                    <th>WAKTU DAFTAR</th>
                    <th>NAMA SISWA</th>
                    <th>L/P</th>
                    <th>TTL</th>
                    <th>NIK SISWA</th>
                    <th>ASAL SEKOLAH</th>
                    <th>NO WA</th>
                    <th>NO KK</th>
                    <th>NAMA AYAH</th>
                    <th>NIK AYAH</th>
                    <th>NAMA IBU</th>
                    <th>NIK IBU</th>
                    <th>NAMA WALI</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr>
                    <td colspan="15" style="text-align: center; padding: 40px; color: #6b7280;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Sedang memuat data dari database...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // URL Web App Google Apps Script Anda (pastikan sama)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzjMgSqdlcVnm7QpK3BlRosxGWvmW47svs2vYMROQ4E58Ej_PR2nMctBQIznpVZQWY/exec';

    let allData = [];

    async function fetchData() {
        try {
            const response = await fetch(scriptURL);
            const data = await response.json();
            allData = data;
            renderTable(allData);
        } catch (error) {
            document.getElementById('dataTableBody').innerHTML = `
                <tr><td colspan="15" style="text-align: center; color: #ef4444; padding: 20px;">Gagal memuat data. Pastikan URL dan fungsi doGet sudah benar.</td></tr>
            `;
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('dataTableBody');
        document.getElementById('totalData').innerText = `Total Pendaftar: ${data.length} Data`;
        
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="15" style="text-align: center; color: #6b7280; padding: 20px;">Belum ada data pendaftar inden yang masuk.</td></tr>`;
            return;
        }

        let html = '';
        data.forEach((row, index) => {
            let formattedDate = row.timestamp ? new Date(row.timestamp).toLocaleString('id-ID') : '-';
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${formattedDate}</td>
                    <td style="font-weight: 600; color: #0d9488;">${row.nama || '-'}</td>
                    <td>${row.gender || '-'}</td>
                    <td>${row.tempatLahir || ''}, ${row.tanggalLahir || ''}</td>
                    <td>${row.nikSiswa || '-'}</td>
                    <td>${row.asalSekolah || '-'}</td>
                    <td>${row.wa || '-'}</td>
                    <td>${row.noKk || '-'}</td>
                    <td>${row.namaAyah || '-'}</td>
                    <td>${row.nikAyah || '-'}</td>
                    <td>${row.namaIbu || '-'}</td>
                    <td>${row.nikIbu || '-'}</td>
                    <td>${row.namaWali !== '-' ? row.namaWali + ' (' + row.nikWali + ')' : '-'}</td>
                    <td><span class="badge"><i class="fa-solid fa-check"></i> Terdaftar</span></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(row => {
            const nama = (row.nama || '').toLowerCase();
            const ayah = (row.namaAyah || '').toLowerCase();
            const ibu = (row.namaIbu || '').toLowerCase();
            return nama.includes(query) || ayah.includes(query) || ibu.includes(query);
        });
        renderTable(filtered);
    }

    fetchData();
</script>

</body>
</html>
