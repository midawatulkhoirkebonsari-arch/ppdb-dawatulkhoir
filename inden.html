<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Jalur INDEN - MI DA'WATUL KHOIR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        label span {
            color: #ef4444;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }
        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn:hover {
            background-color: var(--primary-dark);
        }
        .alert-success {
            display: none;
            background-color: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MI DA'WATUL KHOIR</h2>
    <div class="subtitle">Formulir Pendaftaran Jalur INDEN TP 2027/2028</div>

    <div id="alertSuccess" class="alert-success">
        <i class="fa-solid fa-circle-check"></i> Pendaftaran Berhasil! Data Anda sudah masuk ke sistem kami.
    </div>

    <form id="indenForm">
        <div class="form-group">
            <label>Nama Lengkap Siswa <span>*</span></label>
            <input type="text" id="nama" name="nama" placeholder="Sesuai Akte Kelahiran" required>
        </div>

        <div class="form-group">
            <label>Jenis Kelamin <span>*</span></label>
            <select id="gender" name="gender" required>
                <option value="">Pilih Jenis Kelamin</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tempat Lahir <span>*</span></label>
            <input type="text" id="tempatLahir" name="tempatLahir" placeholder="Kota Kelahiran" required>
        </div>

        <div class="form-group">
            <label>Tanggal Lahir <span>*</span></label>
            <input type="date" id="tanggalLahir" name="tanggalLahir" required>
        </div>

        <div class="form-group">
            <label>Nama Orang Tua / Wali <span>*</span></label>
            <input type="text" id="namaWali" name="namaWali" placeholder="Nama Ayah/Ibu" required>
        </div>

        <div class="form-group">
            <label>Nomor WhatsApp Aktif <span>*</span></label>
            <input type="tel" id="wa" name="wa" placeholder="Contoh: 081234567890" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            <i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran
        </button>
    </form>
</div>

<script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const scriptURL = 'Ganti_Dengan_URL_Web_App_Google_Anda_Di_Sini';

    const form = document.getElementById('indenForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertSuccess = document.getElementById('alertSuccess');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim Data...';

        const formData = {
            nama: document.getElementById('nama').value,
            gender: document.getElementById('gender').value,
            tempatLahir: document.getElementById('tempatLahir').value,
            tanggalLahir: document.getElementById('tanggalLahir').value,
            namaWali: document.getElementById('namaWali').value,
            wa: document.getElementById('wa').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alertSuccess.style.display = 'block';
            form.reset();
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        })
        .catch(error => {
            alert('Terjadi kesalahan, silakan coba lagi.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
        });
    });
</script>

</body>
</html>
